appId: com.k1.seguranca
name: "Empresa — login vazio e senha errada"
tags: [rapido, login]
---
- runFlow: ../comum/abrir.yaml
- runFlow:
    file: ../comum/tocar-inicio.yaml
    env: { BOTAO: "SOU EMPRESA" }
- assertVisible: "ÁREA DA EMPRESA"
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "ENTRAR" }
- scrollUntilVisible:
    element: "Informe e-mail e senha."
    direction: DOWN
- scrollUntilVisible:
    element: "E-MAIL"
    direction: UP
- tapOn: "E-MAIL"
- inputText: "lab-inexistente@k1lab.test"
- pressKey: Tab
- inputText: "SenhaErrada123"
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "ENTRAR" }
- extendedWaitUntil:
    visible: ".*(incorretos|cadastrado|internet|instantes).*"
    timeout: 30000
- assertVisible: "ÁREA DA EMPRESA"
