appId: com.k1.seguranca
name: "Funcionário — login vazio e inválido"
tags: [rapido, login]
---
- runFlow: ../comum/abrir.yaml
- runFlow:
    file: ../comum/tocar-inicio.yaml
    env: { BOTAO: "SOU FUNCIONÁRIO" }
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "ENTRAR" }
- scrollUntilVisible:
    element: "Informe matrícula e senha."
    direction: DOWN
- scrollUntilVisible:
    element: "MATRÍCULA"
    direction: UP
- tapOn: "MATRÍCULA"
- inputText: "LAB0000"
- pressKey: Tab
- inputText: "1234"
- hideKeyboard:
    optional: true
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "ENTRAR" }
- extendedWaitUntil:
    notVisible: "ENTRANDO..."
    timeout: 30000
- runFlow:
    file: ../comum/ver.yaml
    env: { TEXTO: "MATRÍCULA" }
