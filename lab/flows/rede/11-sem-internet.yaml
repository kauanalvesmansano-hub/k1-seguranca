appId: com.k1.seguranca
name: "Rede — login sem internet, depois reconecta"
tags: [rede]
---
- runFlow: ../comum/abrir.yaml
- runFlow:
    file: ../comum/tocar-inicio.yaml
    env: { BOTAO: "SOU EMPRESA" }
- setAirplaneMode: enabled
- tapOn: "E-MAIL"
- inputText: "lab-inexistente@k1lab.test"
- pressKey: Tab
- inputText: "SenhaErrada123"
- hideKeyboard
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "ENTRAR" }
- extendedWaitUntil:
    visible: ".*(internet|conexão|instantes).*"
    timeout: 45000
- setAirplaneMode: disabled
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "ENTRAR" }
- extendedWaitUntil:
    visible: ".*(incorretos|cadastrado).*"
    timeout: 45000
