appId: com.k1.seguranca
name: "Cadastro da empresa — validações (sem criar conta)"
tags: [completo, cadastro]
---
- runFlow: ../comum/abrir.yaml
- runFlow:
    file: ../comum/tocar-inicio.yaml
    env: { BOTAO: "SOU EMPRESA" }
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: ".*CADASTRE SUA EMPRESA.*" }
- runFlow:
    file: ../comum/ver.yaml
    env: { TEXTO: "CADASTRO DA EMPRESA" }
- scrollUntilVisible:
    element: "CADASTRAR EMPRESA"
    direction: DOWN
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "CADASTRAR EMPRESA" }
- scrollUntilVisible:
    element: ".*Preencha empresa, responsável e quantidade.*"
    direction: DOWN
