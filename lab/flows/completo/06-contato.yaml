appId: com.k1.seguranca
name: "Contato de emergência — código inválido"
tags: [completo, contato]
---
- runFlow: ../comum/abrir.yaml
- scrollUntilVisible:
    element: "SOU CONTATO DE EMERGÊNCIA"
    direction: DOWN
- tapOn: "SOU CONTATO DE EMERGÊNCIA"
- runFlow:
    file: ../comum/ver.yaml
    env: { TEXTO: "Sou contato de emergência" }
- tapOn: "000000"
- inputText: "12345"   # 5 dígitos: nunca bate com um convite real (6 dígitos)
- tapOn: "Seu nome \\(ex.: Mãe, João\\)"
- inputText: "Lab Teste"
- hideKeyboard
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "RECEBER OS ALERTAS NESTE CELULAR" }
- extendedWaitUntil:
    visible: ".*Digite os 6 números.*"
    timeout: 15000
- tapOn: "OK"
- runFlow:
    file: ../comum/ver.yaml
    env: { TEXTO: "Sou contato de emergência" }
