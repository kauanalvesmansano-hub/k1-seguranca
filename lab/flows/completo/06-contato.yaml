appId: com.k1.seguranca
name: "Contato de emergência: código inválido"
tags: [completo, contato]
---
- runFlow: ../comum/abrir.yaml
- scrollUntilVisible:
    element: "SOU CONTATO DE EMERGÊNCIA"
    direction: DOWN
- tapOn: "SOU CONTATO DE EMERGÊNCIA"
- assertVisible: "Sou contato de emergência"
- takeScreenshot: 06-contato
- tapOn: "000000"
- inputText: "12345"   # 5 dígitos: nunca bate com um convite real (6 dígitos)
- tapOn: "Seu nome (ex.: Mãe, João)"
- inputText: "Lab Teste"
- hideKeyboard
- tapOn: "RECEBER OS ALERTAS NESTE CELULAR"
- extendedWaitUntil:
    visible: "Sou contato de emergência"
    timeout: 30000
- takeScreenshot: 06-contato-codigo-invalido
