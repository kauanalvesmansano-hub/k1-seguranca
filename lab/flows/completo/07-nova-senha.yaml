appId: com.k1.seguranca
name: "Senha nova: abre por link e recusa código errado"
tags: [completo, senha]
---
- runFlow: ../comum/abrir.yaml
- openLink: "k1seguranca://nova-senha"
- extendedWaitUntil:
    visible: "CRIAR NOVA SENHA"
    timeout: 20000
- assertVisible: "CÓDIGO DO E-MAIL"
- tapOn: "SALVAR SENHA NOVA"
- assertVisible: ".*8 ou mais caracteres.*"
- tapOn: "E-MAIL"
- inputText: "lab-inexistente@k1lab.test"
- tapOn: "CÓDIGO DO E-MAIL"
- inputText: "000000"
- tapOn: "SENHA NOVA (8+, LETRAS E NÚMEROS)"
- inputText: "LabTeste123"
- tapOn: "REPITA A SENHA NOVA"
- inputText: "LabTeste123"
- hideKeyboard
- tapOn: "SALVAR SENHA NOVA"
- extendedWaitUntil:
    visible: ".*(vencid|errad|inválid|internet|instantes).*"
    timeout: 30000
- takeScreenshot: 07-nova-senha-codigo-errado
