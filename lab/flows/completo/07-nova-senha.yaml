appId: com.k1.seguranca
name: "Senha nova — abre por link e recusa código errado"
tags: [completo, senha]
---
- runFlow: ../comum/abrir.yaml
- openLink: "k1seguranca://nova-senha"
- runFlow:
    file: ../comum/ver.yaml
    env: { TEXTO: "CRIAR NOVA SENHA" }
- scrollUntilVisible:
    element: "CÓDIGO DO E-MAIL"
    direction: DOWN
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "SALVAR SENHA NOVA" }
- scrollUntilVisible:
    element: ".*8 ou mais caracteres.*"
    direction: DOWN
- scrollUntilVisible:
    element: "E-MAIL"
    direction: UP
- tapOn: "E-MAIL"
- inputText: "lab-inexistente@k1lab.test"
- tapOn: "CÓDIGO DO E-MAIL"
- inputText: "000000"
- pressKey: Tab
- inputText: "LabTeste123"
# o botão do "olho" da 1ª senha também recebe o TAB: dois TABs até o campo "repita"
- pressKey: Tab
- pressKey: Tab
- inputText: "LabTeste123"
- hideKeyboard:
    optional: true
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "SALVAR SENHA NOVA" }
- waitForAnimationToEnd:
    timeout: 45000
- runFlow:
    file: ../comum/ver.yaml
    env: { TEXTO: ".*(vencid|errad|inválid|internet|instantes).*" }
