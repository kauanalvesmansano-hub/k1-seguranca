appId: com.k1.seguranca
name: "Senha nova — abre por link e recusa código errado"
tags: [completo, senha]
---
- runFlow: ../comum/abrir.yaml
- openLink: "k1seguranca://nova-senha"
- extendedWaitUntil:
    visible: "CRIAR NOVA SENHA"
    timeout: 20000
- scrollUntilVisible:
    element: "CÓDIGO DO E-MAIL"
    direction: DOWN
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "SALVAR SENHA NOVA" }
- scrollUntilVisible:
    element: ".*8 ou mais caracteres.*"
    direction: DOWN
- scrollUntilVisible:
    element: "E-MAIL"
    direction: UP
- tapOn: "E-MAIL"
- inputText: "lab-inexistente@k1lab.test"
- tapOn: "CÓDIGO DO E-MAIL"
- inputText: "000000"
- pressKey: Tab
- inputText: "LabTeste123"
- pressKey: Tab
- inputText: "LabTeste123"
- hideKeyboard
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "SALVAR SENHA NOVA" }
- extendedWaitUntil:
    visible: ".*(vencid|errad|inválid|internet|instantes).*"
    timeout: 30000
