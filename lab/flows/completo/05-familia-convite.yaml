appId: com.k1.seguranca
name: "Família — código de convite inválido"
tags: [completo, familia]
---
- runFlow: ../comum/abrir.yaml
- runFlow:
    file: ../comum/tocar-inicio.yaml
    env: { BOTAO: "PESSOAL / FAMÍLIA" }
- runFlow:
    file: ../comum/ver.yaml
    env: { TEXTO: "K1 FAMÍLIA · PROTEÇÃO PESSOAL" }
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "ENTRAR NA FAMÍLIA" }
- scrollUntilVisible:
    element: ".*O código tem 8 letras e números.*"
    direction: DOWN
- scrollUntilVisible:
    element: "CÓDIGO \\(EX.: AB3K-9QXZ\\)"
    direction: UP
- tapOn: "CÓDIGO \\(EX.: AB3K-9QXZ\\)"
- inputText: "OOOO0000"   # O e 0 não existem nos convites reais
- hideKeyboard:
    optional: true
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "ENTRAR NA FAMÍLIA" }
- extendedWaitUntil:
    visible: "K1 FAMÍLIA · PROTEÇÃO PESSOAL"
    timeout: 30000
