appId: com.k1.seguranca
name: "Falhas — app sem nenhuma permissão"
tags: [falhas]
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- waitForAnimationToEnd:
    timeout: 15000
- scrollUntilVisible:
    element: "COMO VOCÊ VAI ACESSAR?"
    direction: DOWN
    timeout: 60000
- runFlow:
    file: ../comum/tocar-inicio.yaml
    env: { BOTAO: "SOU FUNCIONÁRIO" }
- runFlow:
    file: ../comum/ver.yaml
    env: { TEXTO: "MATRÍCULA" }
- back
- scrollUntilVisible:
    element: "SOU CONTATO DE EMERGÊNCIA"
    direction: DOWN
- tapOn: "SOU CONTATO DE EMERGÊNCIA"
