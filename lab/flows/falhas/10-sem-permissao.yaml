appId: com.k1.seguranca
name: "Falhas: app sem nenhuma permissão"
tags: [falhas]
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "COMO VOCÊ VAI ACESSAR?"
    timeout: 90000
- takeScreenshot: 10-sem-permissao
- tapOn: "SOU FUNCIONÁRIO"
- assertVisible: "MATRÍCULA"
- back
- scrollUntilVisible:
    element: "SOU CONTATO DE EMERGÊNCIA"
    direction: DOWN
- tapOn: "SOU CONTATO DE EMERGÊNCIA"
- takeScreenshot: 10-contato-sem-permissao
