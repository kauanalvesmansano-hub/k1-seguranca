appId: com.k1.seguranca
name: "Falhas — minimizar, reabrir, girar, voltar e toques rápidos"
tags: [falhas]
---
- runFlow: ../comum/abrir.yaml
- runFlow:
    file: ../comum/tocar-inicio.yaml
    env: { BOTAO: "SOU EMPRESA" }
- pressKey: Home
- launchApp:
    clearState: false
- scrollUntilVisible: { element: "ÁREA DA EMPRESA", direction: DOWN }
- setOrientation: LANDSCAPE_LEFT
- setOrientation: PORTRAIT
- scrollUntilVisible: { element: "ENTRAR", direction: DOWN }
- tapOn:
    text: "ENTRAR"
    repeat: 8
    delay: 50
- scrollUntilVisible: { element: "E-MAIL", direction: UP }
- tapOn: "E-MAIL"
- inputRandomText:
    length: 400
- hideKeyboard:
    optional: true
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "ENTRAR" }
- back
- back
- stopApp
- launchApp:
    clearState: false
- scrollUntilVisible:
    element: "COMO VOCÊ VAI ACESSAR?"
    direction: DOWN
    timeout: 60000
