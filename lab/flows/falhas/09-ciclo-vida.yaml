appId: com.k1.seguranca
name: "Falhas — minimizar, reabrir, girar, voltar e toques rápidos"
tags: [falhas]
---
- runFlow: ../comum/abrir.yaml
- runFlow:
    file: ../comum/tocar-inicio.yaml
    env: { BOTAO: "SOU EMPRESA" }
- pressKey: Home
- launchApp:
    clearState: false
- assertVisible: "ÁREA DA EMPRESA"
- setOrientation: LANDSCAPE
- setOrientation: PORTRAIT
- tapOn:
    text: "ENTRAR"
    repeat: 8
    delay: 50
- assertVisible: "ÁREA DA EMPRESA"
- tapOn: "E-MAIL"
- inputRandomText:
    length: 400
- runFlow:
    file: ../comum/tocar.yaml
    env: { ALVO: "ENTRAR" }
- back
- back
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "COMO VOCÊ VAI ACESSAR?"
    timeout: 60000
