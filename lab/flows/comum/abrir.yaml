appId: com.k1.seguranca
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- waitForAnimationToEnd:
    timeout: 15000
# em celular pequeno a foto do topo empurra o título para baixo da dobra: rola até ele
- scrollUntilVisible:
    element: "COMO VOCÊ VAI ACESSAR?"
    direction: DOWN
    timeout: 60000
